<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <title>Mini Garage Plus</title>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- car body (front view) -->
  <rect x="10" y="32" width="44" height="14" rx="4" fill="#ffffff"/>
  <!-- windshield -->
  <path d="M20 32 L22 24 H42 L44 32 Z" fill="#bae6fd"/>
  <rect x="23" y="25.5" width="18" height="2.2" rx="1.1" fill="#93c5fd"/>

  <!-- headlights -->
  <rect x="13.5" y="35" width="7" height="5" rx="1.6" fill="#fde047"/>
  <rect x="43.5" y="35" width="7" height="5" rx="1.6" fill="#fde047"/>

  <!-- grille -->
  <rect x="29" y="34" width="6" height="8.5" rx="1.5" fill="#0f172a"/>
  <rect x="27" y="33" width="10" height="1.4" rx="0.7" fill="#0f172a"/>

  <!-- bumper -->
  <rect x="12" y="44" width="40" height="4.5" rx="2" fill="#0f172a" opacity="0.85"/>

  <!-- plus badge -->
  <rect x="38" y="4" width="20" height="20" rx="6" fill="#f59e0b"/>
  <rect x="45.6" y="8.2" width="4.8" height="11.6" rx="2.2" fill="#ffffff"/>
  <rect x="42.2" y="11.6" width="11.6" height="4.8" rx="2.2" fill="#ffffff"/>
</svg>